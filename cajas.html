<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cajas</title>
    <style>
      /* General Styles */
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f9;
        color: #333;
        line-height: 1.6;
      }

      /* Navigation Bar */
      nav {
        background-color: #007bff;
        padding: 1rem;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 1rem;
        font-weight: bold;
        transition: color 0.3s ease;
      }
      nav a:hover {
        color: #ffdd57;
      }

      /* Table Styles */
      .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 1rem;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      table th,
      table td {
        padding: 0.8rem;
        text-align: left;
        border: 1px solid #ddd;
      }
      table th {
        background-color: #007bff;
        color: white;
      }
      table tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      table tr:hover {
        background-color: #f1f1f1;
      }
      .btn-delete {
        background-color: #dc3545;
        color: white;
      }
      .btn-delete:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="renderer.html">Inicio</a>
      <a href="clientes.html">Clientes</a>
      <a href="cajas.html">Cajas</a>
      <a href="bebes.html">Bebés</a>
    </nav>

    <div class="container">
      <h2>Lista de Cajas</h2>
      <table>
        <thead>
          <tr>
            <th>Número de Caja</th>
            <th>Tipo de Caja</th>
            <th>Precio Final</th>
            <th>Estado</th>
            <th>Fecha de Entrega</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cajas-tbody">
          <!-- Los datos se cargarán aquí dinámicamente -->
        </tbody>
      </table>
    </div>

    <script>
      // Cargar datos de cajas desde el proceso principal
      async function cargarCajas() {
        try {
          const response = await window.electron.obtenerCajas(); // Llama al método expuesto en preload.js
          if (response.success) {
            const cajas = response.data;
            const tbody = document.getElementById("cajas-tbody");
            tbody.innerHTML = ""; // Limpiar contenido previo

            cajas.forEach((caja) => {
              const row = document.createElement("tr");
              row.innerHTML = `
                <td>${caja.numero_caja}</td>
                <td>${caja.tipo_caja || "N/A"}</td>
                <td>${caja.precio_final || "N/A"}</td>
                <td>${caja.estado}</td>
                <td>${caja.fecha_entrega || "N/A"}</td>
                <td>
                  <button class="btn btn-delete" onclick="eliminarCaja('${
                    caja.numero_caja
                  }')">Eliminar</button>
                </td>
              `;
              tbody.appendChild(row);
            });
          } else {
            console.error("Error al cargar las cajas:", response.message);
          }
        } catch (error) {
          console.error("Error inesperado al cargar las cajas:", error);
        }
      }
      async function eliminarCaja(numeroCaja) {
        if (confirm("¿Estás seguro de que deseas eliminar esta caja?")) {
          try {
            const response = await window.electron.eliminarCaja(numeroCaja);
            if (response.success) {
              alert("Caja eliminada correctamente.");
              cargarCajas(); // Recargar la lista de cajas
            } else {
              console.error("Error al eliminar la caja:", response.message);
              alert("Error al eliminar la caja.");
            }
          } catch (error) {
            console.error("Error inesperado al eliminar la caja:", error);
            alert("Error inesperado al eliminar la caja.");
          }
        }
      }

      // Llamar a la función al cargar la página
      window.onload = cargarCajas;
    </script>
  </body>
</html>
