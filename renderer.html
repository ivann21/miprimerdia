<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Mi Primer Día</title>
    <style>
      /* General Styles */
      body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f9;
        color: #333;
        line-height: 1.6;
      }

      /* Navigation Bar */
      nav {
        background-color: #007bff;
        padding: 1rem;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 1rem;
        font-weight: bold;
        transition: color 0.3s ease;
      }
      nav a:hover {
        color: #ffdd57;
      }

      /* Form Container */
      form {
        max-width: 600px;
        margin: 2rem auto;
        background: #fff;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      /* Form Headings */
      h2 {
        margin-top: 0;
        color: #007bff;
        text-align: center;
        font-size: 1.8rem;
      }

      /* Form Labels */
      label {
        display: block;
        margin-top: 1rem;
        font-weight: bold;
        color: #555;
      }

      /* Form Inputs */
      input,
      select {
        width: 100%;
        padding: 0.8rem;
        margin-top: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.3s ease;
      }
      input:focus,
      select:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
      }

      /* Submit Button */
      button {
        margin-top: 2rem;
        padding: 0.8rem 1.5rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        width: 100%;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #0056b3;
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        form {
          padding: 1rem;
        }
        h2 {
          font-size: 1.5rem;
        }
        nav a {
          margin: 0 0.5rem;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="clientes.html">Clientes</a>
      <a href="cajas.html">Cajas</a>
      <a href="bebes.html">Bebés</a>
    </nav>

    <form id="formulario">
      <h2>Cliente</h2>
      <label for="cliente_nombre">Nombre y apellidos</label>
      <input id="cliente_nombre" required />

      <label for="cliente_email">Email</label>
      <input type="email" id="cliente_email" />

      <label for="cliente_telefono">Teléfono</label>
      <input id="cliente_telefono" />

      <label for="cliente_direccion">Dirección</label>
      <input id="cliente_direccion" />

      <h2>Bebé</h2>
      <label for="bebe_nombre">Nombre</label>
      <input id="bebe_nombre" required />

      <label for="bebe_apellidos">Apellidos</label>
      <input id="bebe_apellidos" required />

      <label for="bebe_fecha_nacimiento">Fecha de nacimiento</label>
      <input type="date" id="bebe_fecha_nacimiento" required />

      <label for="bebe_ciudad">Ciudad familiar</label>
      <input id="bebe_ciudad" />

      <label for="bebe_direccion">Dirección familiar</label>
      <input id="bebe_direccion" />

      <label for="padre_nombre">Nombre del padre (opcional)</label>
      <input id="padre_nombre" />

      <label for="madre_nombre">Nombre de la madre (opcional)</label>
      <input id="madre_nombre" />

      <h2>Caja</h2>
      <label for="caja_numero">Número de caja</label>
      <input id="caja_numero" required />

      <label for="caja_precio">Precio final (€)</label>
      <input type="number" step="0.01" id="caja_precio" required />

      <label for="caja_tipo">Tipo de caja</label>
      <select id="caja_tipo">
        <option value="1">Caja Clásica</option>
        <option value="2">Caja Emotiva</option>
        <option value="3">Caja Sol y Luna</option>
        <option value="4">Caja Candilejas</option>
        <option value="5">Caja Mágica</option>
        <option value="6">Caja Fashion</option>
      </select>

      <button type="submit">Guardar</button>
    </form>

    <script src="renderer.js"></script>
  </body>
</html>
